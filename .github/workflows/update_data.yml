name: Weekly Lotto Data Update

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron은 UTC 기준입니다.
    # 토요일 19:00 UTC = 일요일 04:00 KST
    - cron: "0 19 * * 6"

permissions:
  contents: write

concurrency:
  group: weekly-lotto-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Update latest lotto draw
        run: |
          python update_lotto.py --max-checks 10

      - name: Validate latest data
        run: |
          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("data/lotto_all.csv", encoding="utf-8-sig")

          required = ["round", "n1", "n2", "n3", "n4", "n5", "n6", "bonus"]
          missing_columns = [c for c in required if c not in df.columns]
          assert not missing_columns, f"필수 컬럼 누락: {missing_columns}"

          assert not df["round"].duplicated().any(), "중복 회차가 있습니다."

          for col in ["n1", "n2", "n3", "n4", "n5", "n6", "bonus"]:
              assert df[col].between(1, 45).all(), f"{col} 범위 오류"

          for _, row in df.iterrows():
              main = [int(row[f"n{i}"]) for i in range(1, 7)]
              assert len(set(main)) == 6, f"{int(row['round'])}회 본번호 중복"
              assert int(row["bonus"]) not in set(main), (
                  f"{int(row['round'])}회 보너스/본번호 중복"
              )

          print(
              f"데이터 검증 OK / 최신 회차 {int(df['round'].max())} / "
              f"전체 {len(df)}회"
          )
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotto_all.csv data/lotto64.db || true
          git diff --cached --quiet || git commit -m "Auto update Sunday 04:00 KST lotto data"
          git push
