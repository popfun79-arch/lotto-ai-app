name: Weekly Lotto Data Update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 6"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python update_lotto.py --max-checks 10
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotto_all.csv data/lotto64.db || true
          git diff --cached --quiet || git commit -m "Auto update lotto data"
          git push
