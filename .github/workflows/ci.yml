name: Lotto64 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --editable .

      - name: Compile
        run: |
          python -m py_compile app.py
          python -m py_compile update_lotto.py
          python -m compileall -q lotto64

      - name: Import check
        run: |
          python -c "import lotto64; print('lotto64 import OK:', lotto64.__file__)"
          python -c "from lotto64.analysis.sum_series import forecast_next_sum; print('Sum Series OK')"
          python -c "from lotto64.analysis.gap_sum_series import forecast_next_gap_sum; print('GAP Sum Series OK')"
          python -c "from lotto64.models.pattern_master import master_number_scores; print('Pattern Master OK')"
          python -c "from lotto64.recommend.final_pattern import final_recommendation_bundle; print('Final Engine OK')"
          python -c "from lotto64.recommend.top_of_best import build_top_of_best_sets; print('Top of the Best OK')"

      - name: Tests
        run: |
          python -m pytest -q \
            tests/test_math.py \
            tests/test_validation.py \
            tests/test_sum_series.py \
            tests/test_final_pattern.py \
            tests/test_top_of_best.py \
            tests/test_v42_settings.py \
            tests/test_v43_update.py \
            tests/test_v432_analysis_display.py \
            tests/test_smoke.py
