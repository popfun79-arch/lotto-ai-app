name: Lotto64 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --editable .

      - name: Compile
        run: |
          python -m py_compile app.py
          python -m py_compile update_lotto.py
          python -m compileall -q lotto64

      - name: Import check
        run: |
          python -c "import lotto64; print(lotto64.__file__)"
          python -c "from lotto64.models.pattern_master import master_number_scores; print('Pattern Master OK')"
          python -c "from lotto64.recommend.final_pattern import final_recommendation_bundle; print('Final Engine OK')"

      - name: Tests
        run: |
          python -m pytest -q
