name: Run Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    concurrency:
      group: run-pipeline
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install full requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-full.txt ]; then pip install -r requirements-full.txt; fi

      - name: Run pipeline helper
        run: |
          mkdir -p results
          python scripts/run_pipeline.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Run generate_top10 if present
        run: |
          if [ -f scripts/generate_top10_from_weighted.py ]; then python scripts/generate_top10_from_weighted.py || true; fi

      - name: Execute notebook (optional)
        run: |
          if command -v jupyter >/dev/null 2>&1; then
            jupyter nbconvert --to notebook --execute lotto_analysis_workbook.ipynb --output executed_notebook.ipynb --ExecutePreprocessor.timeout=600 || true
          else
            echo "jupyter not installed; skipping notebook execution"
          fi

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          path: results
